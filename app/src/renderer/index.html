<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>AGENT DECK</title>
<style>
  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: transparent;
  }
  body {
    font-family: "Cascadia Mono", Consolas, "Courier New", monospace;
    user-select: none;
    cursor: default;
  }
  /* 时钟卡：02 的第一个桌面组件；固定尺寸保证热区矩形稳定 */
  #clock-card {
    position: fixed;
    left: 48px;
    top: 48px;
    width: 320px;
    height: 176px;
    box-sizing: border-box;
    padding: 26px 28px;
    background: rgba(0, 0, 0, 0.55);
    border: 1px solid rgba(255, 255, 255, 0.14);
    border-radius: 16px;
    cursor: pointer;
  }
  #clock-time {
    font-size: 56px;
    line-height: 1;
    letter-spacing: 0.04em;
    color: #fff;
  }
  #clock-date {
    margin-top: 16px;
    font-size: 14px;
    letter-spacing: 0.3em;
    color: #9aa0a6;
  }
</style>
</head>
<body>
  <div id="clock-card">
    <div id="clock-time">--:--:--</div>
    <div id="clock-date">---- -- --</div>
  </div>
  <script src="./main.js"></script>
</body>
</html>
