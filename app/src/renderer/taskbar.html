<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>DECK-TASKBAR</title>
<style>
  /* 任务栏条带（工单49）：整页透明，唯 pill 承接点击（热区声明只报 pill 矩形） */
  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: transparent;
  }
  body {
    font-family: "Cascadia Mono", Consolas, "Courier New", monospace;
    user-select: none;
    cursor: default;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  /* 左组 pill（工单52：手钉+运行中应用合并）：贴左缘漂浮；空组不渲染（display:none 由入口控制） */
  #pill-left {
    position: absolute;
    left: 8px;
    top: 50%;
    transform: translateY(-50%);
    display: flex;
    align-items: center;
    column-gap: 2px;
    padding: 4px 6px;
    background: rgba(0, 0, 0, 0.55);
    border: 1px solid rgba(255, 255, 255, 0.14);
    border-radius: 999px;
  }
  .tb-app {
    position: relative;
    width: 32px;
    height: 32px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 8px;
    cursor: pointer;
  }
  .tb-app:hover { background: rgba(255, 255, 255, 0.10); }
  .tb-app img { width: 22px; height: 22px; }
  /* 运行态叠加（工单52：已手钉应用运行时不新增图标，只在原图标下叠指示条） */
  .tb-app.running::after {
    content: "";
    position: absolute;
    left: 50%;
    bottom: 1px;
    transform: translateX(-50%);
    width: 12px;
    height: 2px;
    border-radius: 1px;
    background: rgba(255, 255, 255, 0.85);
  }
  /* 中组 pill：漂浮胶囊（组间缝隙露壁纸/下方窗口——条带其余区域恒穿透） */
  #pill {
    display: flex;
    align-items: center;
    column-gap: 4px;
    padding: 4px 6px;
    background: rgba(0, 0, 0, 0.55);
    border: 1px solid rgba(255, 255, 255, 0.14);
    border-radius: 999px;
  }
  .tb-btn {
    padding: 5px 14px;
    font-size: 11px;
    letter-spacing: 0.18em;
    color: #d6d6d6;
    border-radius: 999px;
    cursor: pointer;
    white-space: nowrap;
  }
  .tb-btn:hover { background: rgba(255, 255, 255, 0.10); color: #fff; }
  .tb-btn:active { background: rgba(255, 255, 255, 0.18); color: #fff; }
</style>
</head>
<body>
<div id="pill-left" role="toolbar" aria-label="任务栏左组"></div>
<div id="pill" role="toolbar" aria-label="任务栏中组"></div>
<script type="module" src="./taskbar.js"></script>
</body>
</html>
