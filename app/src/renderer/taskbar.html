<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>DECK-TASKBAR</title>
<style>
  /* 任务栏条带（工单49/55）：整页透明，唯 pill 承接点击（热区声明只报 pill 矩形） */
  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: transparent;
  }
  body {
    font-family: "Cascadia Mono", Consolas, "Courier New", monospace;
    user-select: none;
    cursor: default;
  }
  .pill {
    display: flex;
    align-items: center;
    column-gap: 4px;
    padding: 4px 6px;
    background: rgba(0, 0, 0, 0.55);
    border: 1px solid rgba(255, 255, 255, 0.14);
    border-radius: 999px;
  }
  /* 中组 pill：漂浮胶囊（组间缝隙露壁纸/下方窗口——条带其余区域恒穿透） */
  #pill {
    position: fixed;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
  }
  /* 右组 pill（工单55）：硬件摘要 →（托盘位 #56 占位）→ 音量 → 时钟；钉右端、给细条让位 */
  #right-pill {
    position: fixed;
    right: 14px;
    top: 50%;
    transform: translateY(-50%);
  }
  .tb-btn {
    padding: 5px 14px;
    font-size: 11px;
    letter-spacing: 0.18em;
    color: #d6d6d6;
    border-radius: 999px;
    cursor: pointer;
    white-space: nowrap;
  }
  .tb-btn:hover { background: rgba(255, 255, 255, 0.10); color: #fff; }
  .tb-btn:active { background: rgba(255, 255, 255, 0.18); color: #fff; }
  /* 右组单元格：摘要/音量/时钟同形同号字体；摘要段间留窄缝 */
  .tb-cell {
    display: flex;
    align-items: center;
    column-gap: 8px;
    padding: 5px 10px;
    font-size: 11px;
    letter-spacing: 0.08em;
    color: #d6d6d6;
    border-radius: 999px;
    cursor: pointer;
    white-space: nowrap;
  }
  .tb-cell:hover { background: rgba(255, 255, 255, 0.10); color: #fff; }
  .tb-cell:active { background: rgba(255, 255, 255, 0.18); color: #fff; }
  /* 摘要编辑态（右键进入）：五项全呈现，未勾选置灰供勾回 */
  .tb-seg.off { opacity: 0.35; }
  #hw-summary.editing { outline: 1px dashed rgba(255, 255, 255, 0.35); }
  /* 托盘位（#56 占位）：本票只留锚位不渲染内容 */
  #tray-slot { display: none; }
  /* 显示桌面细条（工单55）：钉屏幕最右端、撑满条带高度，对齐 Win11 右下角肌肉记忆 */
  #show-desktop {
    position: fixed;
    right: 0;
    top: 0;
    width: 8px;
    height: 100%;
    background: rgba(255, 255, 255, 0.06);
    border-left: 1px solid rgba(255, 255, 255, 0.20);
    cursor: pointer;
  }
  #show-desktop:hover { background: rgba(255, 255, 255, 0.22); }
  #show-desktop:active { background: rgba(255, 255, 255, 0.35); }
</style>
</head>
<body>
<div id="pill" class="pill" role="toolbar" aria-label="任务栏中组"></div>
<div id="right-pill" class="pill" role="toolbar" aria-label="任务栏右组"></div>
<div id="show-desktop" role="button" aria-label="显示桌面"></div>
<script type="module" src="./taskbar.js"></script>
</body>
</html>
