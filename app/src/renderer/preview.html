<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>DECK-WINDOW-PREVIEW</title>
<style>
  /* 窗口预览（工单379）：胶囊展开的横向条目流。可见窗条目留出矩形区 —— DWM 实时缩略图
   * 由主进程按条目矩形直接合成在窗面上（渲染层只留位，不画内容）；最小化窗显示内存缓存帧；
   * 无缓存回退应用图标与标题。条目横向滚动，Esc / 再点胶囊 / 点外收起，鼠标离开不收起。 */
  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #12141a;
    color: #e9e9ee;
  }
  body {
    font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
    user-select: none;
    cursor: default;
  }
  #preview {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    box-sizing: border-box;
    padding: 8px 0 6px;
  }
  #pv-head {
    display: flex;
    align-items: baseline;
    gap: 6px;
    padding: 0 14px 6px;
    font-size: 11px;
    letter-spacing: 0.08em;
    opacity: 0.72;
  }
  #pv-count { font-weight: 700; color: #ffffff; opacity: 1; }
  #pv-hint { margin-left: auto; font-size: 10px; opacity: 0.6; letter-spacing: 0; }
  #pv-strip {
    flex: 1;
    display: flex;
    align-items: stretch;
    gap: 10px;
    padding: 0 12px 4px;
    overflow-x: auto;
    overflow-y: hidden;
    scrollbar-width: thin;
    scrollbar-color: rgba(255, 255, 255, 0.22) transparent;
  }
  #pv-strip::-webkit-scrollbar { height: 6px; }
  #pv-strip::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.22); border-radius: 3px; }
  .pv-item {
    flex: none;
    width: 172px;
    display: flex;
    flex-direction: column;
    gap: 5px;
    padding: 6px;
    box-sizing: border-box;
    border: 1px solid rgba(255, 255, 255, 0.14);
    border-radius: 8px;
    background: #191c24;
    cursor: pointer;
  }
  .pv-item:hover { border-color: rgba(120, 180, 255, 0.72); background: #1e2230; }
  .pv-thumb {
    position: relative;
    width: 158px;
    height: 104px;
    border-radius: 5px;
    overflow: hidden;
    background: #0b0d12;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .pv-thumb.live::after {
    content: "实时";
    font-size: 10px;
    letter-spacing: 0.1em;
    color: rgba(255, 255, 255, 0.34);
  }
  .pv-img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  .pv-fallback {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    padding: 8px;
    text-align: center;
  }
  .pv-icon { width: 32px; height: 32px; image-rendering: auto; }
  .pv-icon[hidden] { display: none; }
  .pv-fb-title {
    font-size: 10px;
    line-height: 1.3;
    opacity: 0.72;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
    word-break: break-all;
  }
  .pv-title {
    font-size: 11px;
    line-height: 1.3;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    opacity: 0.92;
  }
  .pv-empty {
    padding: 24px 14px;
    font-size: 12px;
    opacity: 0.5;
  }
</style>
</head>
<body>
<div id="preview" role="dialog" aria-label="窗口预览">
  <div id="pv-head"><span id="pv-count">0</span><span>个窗口</span><span id="pv-hint">Esc 收起</span></div>
  <div id="pv-strip" tabindex="0"></div>
</div>
<script type="module" src="./preview.js"></script>
</body>
</html>
