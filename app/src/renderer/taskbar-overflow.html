<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>DECK-TRAY-OVERFLOW</title>
<style>
  /* 托盘溢出菜单浮层页（工单162）：整页透明，唯菜单面板承接点击。配色与条带 pill
   * 菜单同一世界观（深底细边、文字实色、hover 反白灰底）。行 = 图标 + 名称（竖排）。 */
  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: transparent;
  }
  body {
    font-family: "Cascadia Mono", Consolas, "Courier New", monospace;
    user-select: none;
    cursor: default;
  }
  #overflow-list {
    position: absolute;
    top: 0;
    left: 0;
    width: 280px;
    max-height: 560px; /* 超长名单滚动（'all' 档 + 图标众多机器态） */
    overflow-y: auto;
    box-sizing: border-box;
    padding: 6px;
    background: rgba(24, 24, 28, 0.92);
    border: 1px solid rgba(255, 255, 255, 0.14);
    border-radius: 12px;
  }
  .ov-row {
    display: flex;
    align-items: center;
    column-gap: 10px;
    padding: 7px 10px;
    border-radius: 8px;
    cursor: pointer;
  }
  .ov-row:hover { background: rgba(255, 255, 255, 0.10); }
  .ov-row img { width: 16px; height: 16px; display: block; } /* 工单240：与条带托盘同档 16px 原生直渲 */
  .ov-px { image-rendering: pixelated; } /* 源小于显示档才挂（判据同条带 trayIconPixelated；16px 源 1:1 直渲不挂） */
  .ov-label {
    font-size: 13px;
    color: #d6d6d6;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .ov-row:hover .ov-label { color: #fff; }
</style>
</head>
<body>
<div id="overflow-list" role="menu" aria-label="托盘溢出菜单"></div>
<script type="module" src="./taskbar-overflow.js"></script>
</body>
</html>
