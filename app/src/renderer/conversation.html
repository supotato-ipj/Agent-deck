<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>DECK-CONVERSATION</title>
<style>
  /* 对话窗（工单332）：内核 UI 的对话小窗——只做呈现与输入（GLOSSARY）。
   * 深底世界观与面板一致；转写 = 用户/回复/工具/权限/系统五类条目；权限请求原样呈现
   * 后端选项（不解释、不代选、绝不超时自动拒绝）。 */
  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    background: #141820;
  }
  body {
    font-family: "Cascadia Mono", Consolas, "Courier New", monospace;
    color: #d6d6d6;
    display: flex;
    flex-direction: column;
    user-select: none;
  }
  header {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 10px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.10);
    flex: none;
  }
  #session-select {
    flex: 1;
    background: #1b2029;
    color: #d6d6d6;
    border: 1px solid rgba(255, 255, 255, 0.14);
    border-radius: 6px;
    font: inherit;
    font-size: 12px;
    padding: 3px 6px;
  }
  button {
    font: inherit;
    font-size: 12px;
    color: #d6d6d6;
    background: #1b2029;
    border: 1px solid rgba(255, 255, 255, 0.14);
    border-radius: 6px;
    padding: 3px 10px;
    cursor: pointer;
  }
  button:hover:not(:disabled) { background: #232a36; color: #fff; }
  button:disabled { opacity: 0.45; cursor: default; }
  #transcript {
    flex: 1;
    overflow-y: auto;
    padding: 10px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .entry { line-height: 1.5; font-size: 13px; white-space: pre-wrap; word-break: break-word; }
  .entry.user { color: #8fd0ff; }
  .entry.user::before { content: "你 › "; color: #4d7ba6; }
  .entry.agent { color: #e6e6e6; }
  .entry.agent::before { content: "DSH › "; color: #6a8f5a; }
  .entry.tool { color: #c9b458; font-size: 12px; }
  .entry.permission { color: #f5a623; font-size: 12px; border: 1px solid rgba(245, 166, 35, 0.4); border-radius: 8px; padding: 8px; }
  .entry.system { color: #7d8590; font-size: 12px; font-style: italic; }
  .entry .resolved { color: #7d8590; }
  .entry.failed-status { color: #e06c75; }
  .perm-actions { display: flex; gap: 6px; margin-top: 6px; }
  .perm-actions button { border-color: rgba(245, 166, 35, 0.6); color: #f5a623; }
  .perm-actions button:hover { background: rgba(245, 166, 35, 0.15); color: #ffc45e; }
  .entry.error-banner { color: #e06c75; border: 1px solid rgba(224, 108, 117, 0.5); border-radius: 8px; padding: 8px; font-size: 12px; }
  #managed-toggle {
    display: flex;
    align-items: center;
    gap: 4px;
    font-size: 12px;
    color: #7d8590;
    cursor: pointer;
    flex: none;
  }
  #managed-toggle input { accent-color: #f5a623; cursor: pointer; }
  #managed-toggle.checked { color: #f5a623; }
  .entry.managed-badge { color: #f5a623; font-size: 12px; }
  .chat-retry { margin-top: 6px; border-color: rgba(143, 208, 255, 0.6); color: #8fd0ff; }
  .chat-retry:hover { background: rgba(143, 208, 255, 0.12); color: #b5e1ff; }
  footer {
    flex: none;
    display: flex;
    gap: 8px;
    padding: 8px 10px;
    border-top: 1px solid rgba(255, 255, 255, 0.10);
  }
  #prompt-input {
    flex: 1;
    background: #1b2029;
    color: #e6e6e6;
    border: 1px solid rgba(255, 255, 255, 0.14);
    border-radius: 6px;
    font: inherit;
    font-size: 13px;
    padding: 6px 8px;
    resize: none;
    height: 44px;
  }
  #status-line { flex: none; padding: 2px 10px 6px; font-size: 11px; color: #7d8590; }
  /* 工单334 待批准安装条（可信内核 UI 的真实手势面） */
  #install-bar { flex: none; border-top: 1px solid rgba(245, 166, 35, 0.35); padding: 6px 10px; font-size: 12px; }
  #grant-bar { flex: none; border-top: 1px solid rgba(245, 166, 35, 0.35); padding: 6px 10px; font-size: 12px; }
  /* 工单339 命名凭证（可信 UI）：名称/头名/绑定可见，secret 只写不读 */
  #cred-bar { flex: none; border-top: 1px solid rgba(245, 166, 35, 0.35); padding: 6px 10px; font-size: 12px; }
  .cred-row { display: flex; align-items: center; gap: 8px; padding: 2px 0; }
  .cred-summary { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: #c9d1d9; }
  .cred-summary .cred-name { color: #f5a623; }
  .cred-bind { font-size: 11px; color: #7d8590; }
  .cred-row button, #cred-bar button { font: inherit; font-size: 11px; padding: 1px 8px; border-radius: 5px; cursor: pointer; background: transparent; }
  .cred-del { border-color: rgba(255, 123, 114, 0.6); color: #ff7b72; }
  .cred-unbind { border-color: rgba(245, 166, 35, 0.6); color: #f5a623; }
  .cred-save, .cred-bind-btn { border-color: rgba(126, 231, 135, 0.6); color: #7ee787; }
  .cred-form { display: flex; gap: 6px; padding: 3px 0; }
  .cred-form input { font: inherit; font-size: 11px; padding: 2px 6px; border-radius: 4px; border: 1px solid rgba(255,255,255,0.14); background: transparent; color: #c9d1d9; }
  .cred-form input[name=cred-name] { width: 110px; }
  .cred-form input[name=cred-secret] { width: 160px; }
  .cred-form input[name=cred-package] { width: 100px; }
  .cred-form input[name=cred-origin] { width: 190px; }
  .cred-form select { font: inherit; font-size: 11px; background: transparent; color: #c9d1d9; border: 1px solid rgba(255,255,255,0.14); border-radius: 4px; }
  .cred-err { font-size: 11px; color: #ff7b72; }
  .grant-row.revoked { opacity: 0.55; }
  .install-row { display: flex; align-items: center; gap: 8px; padding: 3px 0; }
  .install-row.pending .install-summary { color: #f5a623; }
  .install-row.activated .install-summary, .install-row.rejected .install-summary { color: #7d8590; }
  .install-row.failed .install-summary { color: #ff7b72; }
  .install-summary { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .install-row button { font: inherit; font-size: 12px; padding: 2px 10px; border-radius: 5px; cursor: pointer; }
  .install-approve { border-color: rgba(126, 231, 135, 0.6); color: #7ee787; background: transparent; }
  .install-approve:hover { background: rgba(126, 231, 135, 0.12); }
  .install-reject { border-color: rgba(255, 123, 114, 0.6); color: #ff7b72; background: transparent; }
  .install-reject:hover { background: rgba(255, 123, 114, 0.12); }
  .install-err { font-size: 11px; color: #ff7b72; }
</style>
</head>
<body>
<header>
  <select id="session-select" aria-label="会话"></select>
  <label id="managed-toggle" title="勾选后创建管理型会话：DSH 经会话凭证与只读 MCP 读取面板快照/插件清单/用户根源码/契约目录（全有或全无，失败不自动降级——ADR-0018）">
    <input type="checkbox" id="chk-managed">管理
  </label>
  <button id="btn-new" title="创建新会话（勾选「管理」= 管理型，需显式授权）">新会话</button>
  <button id="btn-cancel" disabled title="取消在途回复">取消</button>
  <button id="btn-end" title="显式结束当前会话（回收进程）">结束</button>
  <button id="btn-fresh-dir" title="创建全新 DSH 数据目录并切换指向（工单340/ADR-0026）：旧目录原样保留，新目录不继承旧会话；失败不自动清空或降级">全新数据目录</button>
</header>
<div id="install-bar" style="display:none"></div>
<div id="grant-bar" style="display:none"></div>
<div id="cred-bar" style="display:none"></div>
<div id="transcript"></div>
<div id="status-line"></div>
<footer>
  <textarea id="prompt-input" placeholder="向 DSH 发送消息（Enter 发送，Shift+Enter 换行）"></textarea>
  <button id="btn-send">发送</button>
</footer>
<script type="module" src="./conversation.js"></script>
</body>
</html>
