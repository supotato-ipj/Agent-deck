name: test

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      # 证据 PNG 硬闸（spec #281）：跟踪集证据 PNG 计数=0，非零快失败。
      # 零依赖、不装包即跑；必须仓库根执行（不继承 job 级 working-directory: app）。
      - name: Evidence PNG sentinel
        working-directory: .
        run: node app/scripts/evidence-png-sentinel.js
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install dependencies
        run: npm ci
      # electron ≥38 的包不再带 postinstall，二进制按需下载：测试图里第一个
      # require('electron') 会同步拉 ~120MB，把 5s 的用例拖死（工单07 CI 四连实证，
      # service.spec / contract.spec 先后中招）。装依赖后显式装二进制。
      - name: Install Electron binary
        run: npx install-electron
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
