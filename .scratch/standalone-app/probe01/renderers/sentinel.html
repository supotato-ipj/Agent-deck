<!doctype html>
<meta charset="utf-8">
<body style="margin:0;background:#f2c744;">
  <div style="color:#111;font:bold 16px monospace;padding:8px;">SENTINEL</div>
</body>
<script>
  const { ipcRenderer } = require('electron');
  for (const ev of ['mousedown', 'mouseup', 'click', 'contextmenu']) {
    window.addEventListener(ev, e => {
      ipcRenderer.send('s:dom', { type: ev, x: e.clientX, y: e.clientY, button: e.button });
    });
  }
</script>
